services:
  db:
    image: postgres:16-alpine
    container_name: ghostpost_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostpost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-ghostpost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ghostpost} -d ${POSTGRES_DB:-ghostpost}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ghostpost:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghostpost_app
    ports:
      - "5173:5173"   # Лендинг и Панель управления (http://localhost:5173)
      - "8000:8000"   # FastAPI Backend (http://localhost:8000)
    volumes:
      - ./session_manager.session:/app/session_manager.session
      - ./temp_media:/app/temp_media
    environment:
      - PYTHONUNBUFFERED=1
      # PostgreSQL: сервер (asyncpg) и бот заказов (psycopg2) сами приведут URL к своему драйверу
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ghostpost}:${POSTGRES_PASSWORD:-changeme_in_env}@db:5432/${POSTGRES_DB:-ghostpost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
