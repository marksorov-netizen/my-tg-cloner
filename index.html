<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GhostPost AI SaaS — Автопостинг и Парсинг Telegram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        background-color: #090909; 
        color: #f5f5f5;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      /* Smooth scrolling & Custom Dark Scrollbar */
      html { scroll-behavior: smooth; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(230,57,70,0.5); }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .glass-card:hover {
        border-color: rgba(230, 57, 70, 0.3);
      }

      /* Mobile Specific Responsive Overrides */
      @media (max-width: 768px) {
        .mobile-stack {
          grid-template-columns: 1fr !important;
          gap: 16px !important;
        }

        .mobile-padding {
          padding: 16px !important;
        }

        .mobile-header-padding {
          padding: 12px 16px !important;
        }

        .mobile-text-sm {
          font-size: 13px !important;
        }

        .mobile-title-lg {
          font-size: 20px !important;
        }

        .desktop-only {
          display: none !important;
        }

        .mobile-only {
          display: flex !important;
        }
      }

      @media (min-width: 769px) {
        .mobile-only {
          display: none !important;
        }
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('root');
        if (el && (!el.children || el.children.length <= 1)) {
          el.innerHTML = '<div style="color: #ff6b6b; padding: 24px; font-family: monospace; background: #141414; margin: 20px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.5); line-height: 1.6;">'
            + '<h3 style="margin-top:0; font-size: 18px;">❌ Ошибка загрузки скриптов:</h3>'
            + '<p style="color: #fff; font-size: 14px;">' + (e.message || e.error || 'Неизвестная ошибка') + '</p>'
            + '<div style="color: #888; font-size: 12px; margin-top: 10px;">Файл: ' + (e.filename || '—') + ':' + (e.lineno || '') + '</div>'
            + '<div style="margin-top: 16px; color: #f4a623; font-size: 13px;">💡 Нажмите F12 в браузере и откройте вкладку Console для подробностей.</div>'
            + '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el && (!el.children || el.children.length <= 1)) {
          el.innerHTML = '<div style="color: #ff6b6b; padding: 24px; font-family: monospace; background: #141414; margin: 20px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.5); line-height: 1.6;">'
            + '<h3 style="margin-top:0; font-size: 18px;">❌ Ошибка промиса:</h3>'
            + '<p style="color: #fff; font-size: 14px;">' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</p>'
            + '</div>';
        }
      });
    </script>
</head>
  <body>
    <div id="root">
      <div style="color: rgba(255,255,255,0.7); padding: 50px; text-align: center; font-family: sans-serif; font-size: 16px;">
        ⏳ Загрузка GhostPost...
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
